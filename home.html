<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Paper Generator — Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Paper Generator</h1>
      <p id="welcomeMsg">Welcome</p>
    </div>
    <button class="btn btn-ghost" style="width:auto; padding:8px 14px; font-size:13px;" onclick="logout()">Log Out</button>
  </header>

  <main>
    <div class="seal">NEW<br>PAPER</div>

    <div class="field">
      <label for="classSelect">Class</label>
      <select id="classSelect">
        <option value="" disabled selected>Select class</option>
        <option value="9">Class 9</option>
        <option value="10">Class 10</option>
        <option value="11">Class 11</option>
        <option value="12">Class 12</option>
      </select>
    </div>

    <div class="field">
      <label for="subjectSelect">Subject</label>
      <select id="subjectSelect" disabled>
        <option value="" disabled selected>Select class first</option>
      </select>
    </div>

    <button class="btn btn-primary" id="continueBtn" disabled onclick="goToCategories()">Continue</button>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin();
  const user = getCurrentUser();
  if (user) {
    document.getElementById("welcomeMsg").textContent = "Welcome, " + user;
  }

  const classSelect = document.getElementById("classSelect");
  const subjectSelect = document.getElementById("subjectSelect");
  const continueBtn = document.getElementById("continueBtn");

  classSelect.addEventListener("change", function () {
    const cls = classSelect.value;
    const subjects = getSubjectsForClass(cls);

    subjectSelect.innerHTML = '<option value="" disabled selected>Select subject</option>' +
      subjects.map(s => `<option value="${s}">${s}</option>`).join("");
    subjectSelect.disabled = false;
    continueBtn.disabled = true;
  });

  subjectSelect.addEventListener("change", function () {
    continueBtn.disabled = !subjectSelect.value;
  });

  function goToCategories() {
    saveSelection("class", classSelect.value);
    saveSelection("subject", subjectSelect.value);
    window.location.href = "categories.html";
  }
</script>
</body>
</html>
