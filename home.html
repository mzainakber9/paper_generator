<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Paper Generator — Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Paper Generator</h1>
      <p id="welcomeMsg">Welcome</p>
    </div>
    <button class="btn btn-ghost" style="width:auto; padding:8px 14px; font-size:13px;" onclick="logout()">Log Out</button>
  </header>

  <main>
    <div class="card">
      <p style="margin:0; font-size:14px; color:var(--gray);">
        Login is working. Class and subject selection will be built here next.
      </p>
    </div>
  </main>
</div>

<script src="js/auth.js"></script>
<script>
  requireLogin();
  const user = getCurrentUser();
  if (user) {
    document.getElementById("welcomeMsg").textContent = "Welcome, " + user;
  }
</script>
</body>
</html>
