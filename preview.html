<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Paper Generator — Preview</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Paper Generator</h1>
      <p>Preview (placeholder)</p>
    </div>
    <button class="btn btn-ghost" style="width:auto; padding:8px 14px; font-size:13px;" onclick="logout()">Log Out</button>
  </header>

  <main>
    <div class="card" id="summary"></div>
    <p style="font-size:13px; color:var(--gray);">
      The real formatted paper preview, question reordering, and save will be built here next.
    </p>
    <button class="btn btn-ghost" onclick="window.location.href='chapters.html'">Back to Chapters</button>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin();
  const raw = sessionStorage.getItem("pgen_picks");
  const picks = raw ? JSON.parse(raw) : { mcq: [], short: [], long: [] };
  document.getElementById("summary").innerHTML =
    "<strong>Picked so far:</strong><br>" +
    "MCQs: " + picks.mcq.length + "<br>" +
    "Short: " + picks.short.length + "<br>" +
    "Long: " + picks.long.length;
</script>
</body>
</html>
