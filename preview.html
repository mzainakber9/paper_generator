<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Paper Generator — Preview</title>
<link rel="stylesheet" href="css/style.css">
<style>
  #paperWrap{
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:20px 14px;
    font-family:Georgia,'Times New Roman',serif;
    color:#111;
    font-size:12.5px;
    line-height:1.5;
  }
  #paperWrap h3{ text-align:center; margin:0 0 2px; font-size:16px; }
  #paperWrap .meta-line{ text-align:center; font-size:11.5px; color:#444; margin-bottom:10px; }
  #paperWrap .info-row{
    display:flex; justify-content:space-between;
    border-top:1.5px solid #111; border-bottom:1.5px solid #111;
    padding:5px 2px; font-size:11px; font-weight:bold;
  }
  #paperWrap .idline{
    text-align:center; font-size:11.5px; margin:10px 0 14px;
    border-bottom:1px dotted #999; padding-bottom:14px;
  }
  #paperWrap .sec-title{
    font-weight:bold; font-size:12.5px; background:var(--ink); color:#fff;
    padding:5px 10px; margin:16px 0 4px; font-family:-apple-system,sans-serif;
  }
  #paperWrap .sec-sub{ font-size:11px; font-style:italic; margin:0 0 8px; }
  #paperWrap ol.mcqlist{ padding-left:18px; margin:0; }
  #paperWrap ol.mcqlist > li{ margin-bottom:7px; }
  #paperWrap .opts{
    display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; margin-top:3px; font-size:11.5px;
  }
  #paperWrap table.qtable{ width:100%; border-collapse:collapse; margin-bottom:4px; font-size:11.5px; }
  #paperWrap table.qtable td{ border:1px solid #999; padding:6px 7px; vertical-align:top; }
  #paperWrap table.qtable td.num{ width:34px; text-align:center; font-weight:bold; }
  #paperWrap table.qtable td.or{ width:26px; text-align:center; font-weight:bold; }
  #paperWrap table.qtable td.marks{ font-size:9.5px; color:#555; font-style:italic; display:block; margin-top:3px; }
  .preview-actions{ display:flex; gap:10px; margin-top:16px; }

  @media print{
    body *{ visibility:hidden; }
    #paperWrap, #paperWrap *{ visibility:visible; }
    #paperWrap{ position:absolute; top:0; left:0; width:100%; border:none; padding:0 5mm; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Paper Generator</h1>
      <p>Preview</p>
    </div>
    <button class="btn btn-ghost" style="width:auto; padding:8px 14px; font-size:13px;" onclick="logout()">Log Out</button>
  </header>

  <main>
    <div id="paperWrap"></div>
    <div class="preview-actions">
      <button class="btn btn-ghost" onclick="downloadDoc()">⬇ Word (.doc)</button>
      <button class="btn btn-primary" onclick="window.print()">⬇ PDF (Print)</button>
    </div>
    <button class="btn btn-ghost" style="margin-top:10px;" onclick="window.location.href='details.html'">Back to Details</button>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin();
  const state = getSelectionState();
  const raw = sessionStorage.getItem("pgen_picks");
  const picks = raw ? JSON.parse(raw) : { mcq: [], short: [], long: [] };

  const letters = ["A","B","C","D"];
  const romans = ["i","ii","iii","iv","v","vi","vii","viii","ix","x","xi","xii","xiii","xiv","xv","xvi"];

  /* Pairs an array into OR-parts: [a,b,c,d,e] -> [[a,b],[c,d],[e,null]] */
  function pairUp(arr) {
    const rows = [];
    for (let i = 0; i < arr.length; i += 2) {
      rows.push([arr[i], arr[i+1] || null]);
    }
    return rows;
  }

  function buildPaper() {
    const mcqMarks = state.mcqMarks || 0;
    const shortMarks = state.shortMarks || 0;
    const longMarks = state.longMarks || 0;

    const shortRows = pairUp(picks.short);
    const longRows = pairUp(picks.long);

    const mcqTotal = picks.mcq.length * mcqMarks;
    const shortTotal = shortRows.length * shortMarks;
    const longTotal = longRows.length * longMarks;
    const combinedBC = shortTotal + longTotal;

    let html = `
      <h3>${escapeHtml(state.institution || "Institution Name")}</h3>
      <div class="meta-line">${escapeHtml(state.subject)} — Class ${escapeHtml(state.class)}</div>
      <div class="info-row">
        <span>Time (Section A): ${escapeHtml(state.timeA || "-")}</span>
        <span>Total Marks (Section A): ${mcqTotal}</span>
      </div>
      <div class="info-row" style="border-top:none;">
        <span>Time (Section B &amp; C): ${escapeHtml(state.timeBC || "-")}</span>
        <span>Total Marks (B &amp; C): ${combinedBC}</span>
      </div>
      <div class="idline">
        Class: ${escapeHtml(state.class)} &nbsp;&nbsp; Subject: ${escapeHtml(state.subject)} &nbsp;&nbsp; Roll No: ______________
      </div>`;

    if (picks.mcq.length) {
      html += `<div class="sec-title">Section A — Multiple Choice Questions (Q.1)</div>`;
      html += `<p class="sec-sub">Choose the correct option for each question. (${mcqMarks} marks each)</p>`;
      html += `<ol class="mcqlist">` + picks.mcq.map(q => `
        <li>${escapeHtml(q.text)}
          <div class="opts">
            ${q.options.map((o,i)=>`<span>(${letters[i]}) ${escapeHtml(o)}</span>`).join("")}
          </div>
        </li>`).join("") + `</ol>`;
    }

    if (shortRows.length) {
      html += `<div class="sec-title">Section B — Q.2 (Short Questions)</div>`;
      html += `<p class="sec-sub">Attempt the following parts. (${shortMarks} marks each)</p>`;
      html += `<table class="qtable">` + shortRows.map((row, i) => `
        <tr>
          <td class="num">(${romans[i] || (i+1)})</td>
          <td>${escapeHtml(row[0].text)}</td>
          <td class="or">${row[1] ? "OR" : ""}</td>
          <td>${row[1] ? escapeHtml(row[1].text) : ""}</td>
        </tr>`).join("") + `</table>`;
    }

    if (longRows.length) {
      html += `<div class="sec-title">Section C — Long Questions</div>`;
      html += `<p class="sec-sub">Attempt the following questions. (${longMarks} marks each)</p>`;
      html += `<table class="qtable">` + longRows.map((row, i) => `
        <tr>
          <td class="num">Q.${i+3}</td>
          <td>${escapeHtml(row[0].text)}</td>
          <td class="or">${row[1] ? "OR" : ""}</td>
          <td>${row[1] ? escapeHtml(row[1].text) : ""}</td>
        </tr>`).join("") + `</table>`;
    }

    document.getElementById("paperWrap").innerHTML = html;
  }

  function escapeHtml(str) {
    if (str === undefined || str === null) return "";
    return String(str).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  function downloadDoc() {
    const content = document.getElementById("paperWrap").innerHTML;
    const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
    <head><meta charset="utf-8"><title>Paper</title></head>
    <body style="font-family:Georgia,'Times New Roman',serif; font-size:12.5px;">`;
    const footer = `</body></html>`;
    const blob = new Blob(['\ufeff', header, content, footer], { type: 'application/msword' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (state.class + "_" + state.subject + "_Paper.doc").replace(/\s+/g, "_");
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  buildPaper();
</script>
</body>
</html>
