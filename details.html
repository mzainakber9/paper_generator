<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Paper Generator — Paper Details</title>
<link rel="stylesheet" href="css/colors-and-styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Paper Generator</h1>
      <p id="recapMsg">Class · Subject</p>
    </div>
    <button class="btn btn-ghost" style="width:auto; padding:8px 14px; font-size:13px;" onclick="logout()">Log Out</button>
  </header>

  <main>
    <h2 style="font-size:18px; margin:0 0 4px;">Paper Details</h2>
    <p style="font-size:13px; color:var(--gray); margin:0 0 18px;">These fill in the fixed paper header.</p>

    <form id="detailsForm">
      <div class="field">
        <label for="institution">Institution Name</label>
        <input type="text" id="institution" placeholder="e.g. Concepts College of Sciences" required>
      </div>
      <div class="field">
        <label for="logoUpload">Institution Logo (optional)</label>
        <input type="file" id="logoUpload" accept="image/*">
        <div id="logoPreviewWrap" style="display:none; margin-top:8px; align-items:center; gap:10px;">
          <img id="logoPreview" style="width:48px; height:48px; object-fit:contain; border:1px solid var(--line); border-radius:6px; background:#fff;">
          <button type="button" class="btn btn-ghost" style="width:auto; padding:6px 12px; font-size:12px;" onclick="clearLogo()">Remove</button>
        </div>
      </div>
      <div class="field">
        <label for="timeA">Time Allowed — Section A</label>
        <input type="text" id="timeA" placeholder="e.g. 20 minutes" required>
      </div>
      <div class="field">
        <label for="timeBC">Time Allowed — Section B &amp; C (combined)</label>
        <input type="text" id="timeBC" placeholder="e.g. 2 hours 20 minutes" required>
      </div>
      <div class="field">
        <label for="mcqMarks">Marks per MCQ</label>
        <input type="number" id="mcqMarks" step="0.25" min="0" value="0.75" required>
      </div>
      <div class="field">
        <label for="shortMarks">Marks per Short Question</label>
        <input type="number" id="shortMarks" step="0.5" min="0" value="4" required>
      </div>
      <div class="field">
        <label for="longMarks">Marks per Long Question</label>
        <input type="number" id="longMarks" step="0.5" min="0" value="8" required>
      </div>
      <div class="field" style="display:flex; align-items:center; gap:10px;">
        <input type="checkbox" id="includeKey" style="width:18px; height:18px; accent-color:var(--maroon);">
        <label for="includeKey" style="margin:0;">Include Answer Key (separate page)</label>
      </div>

      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-ghost" onclick="window.location.href='question-picker.html'">Back</button>
        <button type="submit" class="btn btn-primary">Preview Paper</button>
      </div>
    </form>
  </main>
</div>

<script src="js/login-check.js"></script>
<script src="js/subjects-and-session.js"></script>
<script>
  requireLogin();
  const state = getSelectionState();
  if (!state.class || !state.subject) {
    window.location.href = "class-subject.html";
  }
  document.getElementById("recapMsg").textContent = "Class " + state.class + " · " + state.subject;

  // Logo is optional. If the user picks a file we convert it to a data URL
  // and carry it in session state; if they never pick one, logoDataUrl stays
  // null and the paper header renders exactly as it always has.
  let logoDataUrl = null;
  const logoUpload = document.getElementById("logoUpload");
  const logoPreviewWrap = document.getElementById("logoPreviewWrap");
  const logoPreview = document.getElementById("logoPreview");

  logoUpload.addEventListener("change", function() {
    const file = logoUpload.files[0];
    if (!file) { clearLogo(); return; }
    const reader = new FileReader();
    reader.onload = function(e) {
      logoDataUrl = e.target.result;
      logoPreview.src = logoDataUrl;
      logoPreviewWrap.style.display = "flex";
    };
    reader.readAsDataURL(file);
  });

  function clearLogo() {
    logoDataUrl = null;
    logoUpload.value = "";
    logoPreviewWrap.style.display = "none";
  }

  document.getElementById("detailsForm").addEventListener("submit", function(e){
    e.preventDefault();
    saveSelection("institution", document.getElementById("institution").value.trim());
    saveSelection("logoDataUrl", logoDataUrl);
    saveSelection("timeA", document.getElementById("timeA").value.trim());
    saveSelection("timeBC", document.getElementById("timeBC").value.trim());
    saveSelection("mcqMarks", Number(document.getElementById("mcqMarks").value));
    saveSelection("shortMarks", Number(document.getElementById("shortMarks").value));
    saveSelection("longMarks", Number(document.getElementById("longMarks").value));
    saveSelection("includeKey", document.getElementById("includeKey").checked);
    window.location.href = "paper-preview.html";
  });
</script>
</body>
</html>
