<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Paper Generator — Chapters</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .chapter-card{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px; margin-bottom:10px;
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
  }
  .chapter-card .name{font-weight:600; font-size:14px;}
  .chapter-card .count{
    font-size:11px; background:var(--gold); color:#fff;
    padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .q-row{
    display:flex; align-items:flex-start; gap:10px;
    padding:12px; margin-bottom:8px;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    font-size:13.5px;
  }
  .q-row input{width:18px; height:18px; accent-color:var(--maroon); margin-top:2px; flex-shrink:0;}
  .q-row .opts{font-size:12px; color:var(--gray); margin-top:4px;}
  .sec-label{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    color:var(--ink-soft); margin:18px 0 8px;
  }
  .footer-actions{display:flex; gap:10px; margin-top:20px;}
  .view{display:none;}
  .view.active{display:block;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Paper Generator</h1>
      <p id="recapMsg">Class · Subject</p>
    </div>
    <button class="btn btn-ghost" style="width:auto; padding:8px 14px; font-size:13px;" onclick="logout()">Log Out</button>
  </header>

  <main>
    <div id="loadingMsg" style="font-size:14px; color:var(--gray);">Loading question bank…</div>
    <div id="noDataMsg" style="display:none;" class="card">
      No question bank has been added yet for this class/subject.
    </div>

    <!-- VIEW: chapter list -->
    <div class="view" id="chapterListView">
      <h2 style="font-size:17px; margin:0 0 12px;">Select a Chapter</h2>
      <div id="chapterList"></div>
      <div class="footer-actions">
        <button class="btn btn-ghost" onclick="window.location.href='categories.html'">Back</button>
        <button class="btn btn-primary" id="generateBtn" onclick="goToPreview()">Generate Paper</button>
      </div>
    </div>

    <!-- VIEW: question picker for one chapter -->
    <div class="view" id="pickerView">
      <h2 style="font-size:17px; margin:0 0 4px;" id="pickerChapterName"></h2>
      <p style="font-size:12px; color:var(--gray); margin:0 0 14px;">Tick the questions you want from this chapter.</p>
      <div id="pickerSections"></div>
      <div class="footer-actions">
        <button class="btn btn-ghost" onclick="showChapterList()">Save &amp; Back to Chapters</button>
      </div>
    </div>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/catalog.js"></script>
<script>
  requireLogin();
  const state = getSelectionState();
  if (!state.class || !state.subject || !state.types) {
    window.location.href = "home.html";
  }
  document.getElementById("recapMsg").textContent = "Class " + state.class + " · " + state.subject;

  const letters = ["A","B","C","D"];
  let chapterData = null;

  function getPicks() {
    const raw = sessionStorage.getItem("pgen_picks");
    return raw ? JSON.parse(raw) : { mcq: [], short: [], long: [] };
  }
  function savePicks(p) {
    sessionStorage.setItem("pgen_picks", JSON.stringify(p));
  }

  const entry = getCatalogEntry(state.class, state.subject);
  if (!entry) {
    document.getElementById("loadingMsg").style.display = "none";
    document.getElementById("noDataMsg").style.display = "block";
  } else {
    loadDataScript(entry.file).then(() => {
      chapterData = window[entry.varName];
      document.getElementById("loadingMsg").style.display = "none";
      showChapterList();
    }).catch((err) => {
      const el = document.getElementById("loadingMsg");
      el.style.display = "block";
      el.textContent = "Could not load question bank. (" + err.message + ")";
    });
  }

  function setView(id) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function showChapterList() {
    const picks = getPicks();
    const list = document.getElementById("chapterList");
    list.innerHTML = chapterData.chapters.map(ch => {
      const count = ["mcq","short","long"].reduce((sum, t) =>
        sum + picks[t].filter(p => p.chId === ch.id).length, 0);
      return `<div class="chapter-card" onclick="openChapter(${ch.id})">
        <span class="name">Ch. ${ch.id} — ${ch.name}</span>
        ${count > 0 ? `<span class="count">${count} picked</span>` : ""}
      </div>`;
    }).join("");

    const totalPicked = ["mcq","short","long"].reduce((s,t)=>s+picks[t].length,0);
    document.getElementById("generateBtn").disabled = totalPicked === 0;
    setView("chapterListView");
  }

  function openChapter(chId) {
    const ch = chapterData.chapters.find(c => c.id === chId);
    const picks = getPicks();
    document.getElementById("pickerChapterName").textContent = "Ch. " + ch.id + " — " + ch.name;

    let html = "";
    if (state.types.includes("mcq") && ch.mcq.length) {
      html += `<div class="sec-label">MCQs</div>`;
      html += ch.mcq.map((q, i) => {
        const checked = picks.mcq.some(p => p.chId === ch.id && p.idx === i) ? "checked" : "";
        return `<label class="q-row">
          <input type="checkbox" data-type="mcq" data-idx="${i}" ${checked}>
          <span>${q[0]}<div class="opts">${q[1].map((o,oi)=>`(${letters[oi]}) ${o}`).join(" &nbsp; ")}</div></span>
        </label>`;
      }).join("");
    }
    if (state.types.includes("short") && ch.short.length) {
      html += `<div class="sec-label">Short Questions</div>`;
      html += ch.short.map((q, i) => {
        const checked = picks.short.some(p => p.chId === ch.id && p.idx === i) ? "checked" : "";
        return `<label class="q-row">
          <input type="checkbox" data-type="short" data-idx="${i}" ${checked}>
          <span>${q}</span>
        </label>`;
      }).join("");
    }
    if (state.types.includes("long") && ch.long.length) {
      html += `<div class="sec-label">Long Questions</div>`;
      html += ch.long.map((q, i) => {
        const checked = picks.long.some(p => p.chId === ch.id && p.idx === i) ? "checked" : "";
        return `<label class="q-row">
          <input type="checkbox" data-type="long" data-idx="${i}" ${checked}>
          <span>${q}</span>
        </label>`;
      }).join("");
    }
    document.getElementById("pickerSections").innerHTML = html;
    document.getElementById("pickerSections").dataset.chId = chId;
    setView("pickerView");
  }

  // Save picks whenever leaving the picker view
  function collectPickerSelections() {
    const chId = Number(document.getElementById("pickerSections").dataset.chId);
    const ch = chapterData.chapters.find(c => c.id === chId);
    const picks = getPicks();

    ["mcq","short","long"].forEach(type => {
      picks[type] = picks[type].filter(p => p.chId !== chId); // drop old picks for this chapter
      document.querySelectorAll(`input[data-type="${type}"]`).forEach(box => {
        if (box.checked) {
          const idx = Number(box.dataset.idx);
          const q = ch[type][idx];
          picks[type].push({
            chId: chId,
            chName: ch.name,
            idx: idx,
            text: type === "mcq" ? q[0] : q,
            options: type === "mcq" ? q[1] : null,
            correct: type === "mcq" ? q[2] : null
          });
        }
      });
    });
    savePicks(picks);
  }

  const origShowChapterList = showChapterList;
  showChapterList = function() {
    if (document.getElementById("pickerView").classList.contains("active")) {
      collectPickerSelections();
    }
    origShowChapterList();
  };

  function goToPreview() {
    window.location.href = "preview.html";
  }
</script>
</body>
</html>
