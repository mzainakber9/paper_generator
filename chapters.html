<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Paper Generator — Chapters</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
  .chapter-card{
    display:flex; justify-content:space-between; align-items:center;
    padding:16px; margin-bottom:10px;
    background:var(--card); border:1.5px solid var(--line); border-radius:12px;
  }
  .chapter-card .name{font-weight:600; font-size:14px;}
  .chapter-card .count{
    font-size:11px; background:var(--gold); color:#fff;
    padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .q-row{
    display:flex; align-items:flex-start; gap:10px;
    padding:12px; margin-bottom:8px;
    background:var(--card); border:1.5px solid var(--line); border-radius:10px;
    font-size:13.5px;
  }
  .q-row input{width:18px; height:18px; accent-color:var(--maroon); margin-top:2px; flex-shrink:0;}
  .q-row .opts{font-size:12px; color:var(--gray); margin-top:4px;}
  .q-diagram{ margin-top:6px; }
  .q-diagram svg{ max-width:100%; height:auto; display:block; }
  .sec-label{
    font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.4px;
    color:var(--ink-soft); margin:18px 0 8px;
  }
  .exercise-label{
    font-size:12px; font-weight:700; color:var(--maroon);
    margin:12px 0 6px; padding-bottom:3px; border-bottom:1.5px solid var(--maroon);
  }
  .stimulus-box{
    background:#fdf6ec; border:1.5px dashed var(--gold);
    border-radius:8px; padding:10px 12px; margin:10px 0 6px;
    font-size:12.5px; color:var(--ink-soft);
  }
  .stimulus-box .stim-label{
    font-size:10.5px; font-weight:700; text-transform:uppercase;
    color:var(--gold); margin-bottom:4px;
  }
  .footer-actions{display:flex; gap:10px; margin-top:20px;}
  .view{display:none;}
  .view.active{display:block;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Paper Generator</h1>
      <p id="recapMsg">Class · Subject</p>
    </div>
    <button class="btn btn-ghost" style="width:auto; padding:8px 14px; font-size:13px;" onclick="logout()">Log Out</button>
  </header>

  <main>
    <div id="loadingMsg" style="font-size:14px; color:var(--gray);">Loading question bank…</div>
    <div id="noDataMsg" style="display:none;" class="card">
      No question bank has been added yet for this class/subject.
    </div>

    <!-- VIEW: chapter list -->
    <div class="view" id="chapterListView">
      <h2 style="font-size:17px; margin:0 0 12px;">Select a Chapter</h2>
      <div id="chapterList"></div>
      <div class="footer-actions">
        <button class="btn btn-ghost" onclick="window.location.href='categories.html'">Back</button>
        <button class="btn btn-primary" id="generateBtn" onclick="goToPreview()">Generate Paper</button>
      </div>
    </div>

    <!-- VIEW: question picker for one chapter -->
    <div class="view" id="pickerView">
      <h2 style="font-size:17px; margin:0 0 4px;" id="pickerChapterName"></h2>
      <p style="font-size:12px; color:var(--gray); margin:0 0 14px;">Tick the questions you want from this chapter.</p>
      <div id="pickerSections"></div>
      <div class="footer-actions">
        <button class="btn btn-ghost" onclick="showChapterList()">Save &amp; Back to Chapters</button>
      </div>
    </div>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/catalog.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script>
  requireLogin();
  const state = getSelectionState();
  if (!state.class || !state.subject || !state.types) {
    window.location.href = "home.html";
  }
  document.getElementById("recapMsg").textContent = "Class " + state.class + " · " + state.subject;

  const letters = ["A","B","C","D"];
  let chapterData = null;

  function renderMathIn(el) {
    if (window.renderMathInElement) {
      renderMathInElement(el, {
        delimiters: [
          { left: "\\(", right: "\\)", display: false },
          { left: "\\[", right: "\\]", display: true }
        ],
        throwOnError: false
      });
    }
  }
  function escapeHtml(str) {
    if (str === undefined || str === null) return "";
    return String(str).replace(/[&<>"']/g, c => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
    }[c]));
  }

  function getPicks() {
    const raw = sessionStorage.getItem("pgen_picks");
    return raw ? JSON.parse(raw) : { mcq: [], short: [], long: [] };
  }
  function savePicks(p) {
    sessionStorage.setItem("pgen_picks", JSON.stringify(p));
  }

  const entry = getCatalogEntry(state.class, state.subject);
  if (!entry) {
    document.getElementById("loadingMsg").style.display = "none";
    document.getElementById("noDataMsg").style.display = "block";
  } else {
    loadAllChapters(entry).then((data) => {
      chapterData = data;
      document.getElementById("loadingMsg").style.display = "none";
      showChapterList();
    }).catch((err) => {
      const el = document.getElementById("loadingMsg");
      el.style.display = "block";
      el.textContent = "Could not load question bank. (" + err.message + ")";
    });
  }

  function setView(id) {
    document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }

  function showChapterList() {
    const picks = getPicks();
    const list = document.getElementById("chapterList");
    list.innerHTML = chapterData.chapters.map(ch => {
      const count = ["mcq","short","long"].reduce((sum, t) =>
        sum + picks[t].filter(p => p.chId === ch.id).length, 0);
      return `<div class="chapter-card" onclick="openChapter(${ch.id})">
        <span class="name">Ch. ${ch.id} — ${ch.name}</span>
        ${count > 0 ? `<span class="count">${count} picked</span>` : ""}
      </div>`;
    }).join("");

    const totalPicked = ["mcq","short","long"].reduce((s,t)=>s+picks[t].length,0);
    document.getElementById("generateBtn").disabled = totalPicked === 0;
    setView("chapterListView");
  }

  function openChapter(chId) {
    const ch = chapterData.chapters.find(c => c.id === chId);
    const picks = getPicks();
    document.getElementById("pickerChapterName").textContent = "Ch. " + ch.id + " — " + ch.name;

    let html = "";
    if (state.types.includes("mcq") && ch.mcq.length) {
      html += `<div class="sec-label">MCQs</div>`;
      html += ch.mcq.map((q, i) => {
        const checked = picks.mcq.some(p => p.chId === ch.id && p.idx === i && p.stimGroup === undefined) ? "checked" : "";
        return `<label class="q-row">
          <input type="checkbox" data-type="mcq" data-idx="${i}" ${checked}>
          <span>${escapeHtml(q[0])}<div class="opts">${q[1].map((o,oi)=>`(${letters[oi]}) ${escapeHtml(o)}`).join(" &nbsp; ")}</div></span>
        </label>`;
      }).join("");
    }
    if (state.types.includes("mcq") && ch.mcqStimulus && ch.mcqStimulus.length) {
      html += `<div class="sec-label">MCQs (Stimulus-Based)</div>`;
      ch.mcqStimulus.forEach((group, gIdx) => {
        html += `<div class="stimulus-box"><div class="stim-label">Scenario</div>${escapeHtml(group.stimulus)}</div>`;
        html += group.questions.map((q, qIdx) => {
          const checked = picks.mcq.some(p => p.chId === ch.id && p.stimGroup === gIdx && p.idx === qIdx) ? "checked" : "";
          return `<label class="q-row">
            <input type="checkbox" data-type="mcqstim" data-gidx="${gIdx}" data-idx="${qIdx}" ${checked}>
            <span>${escapeHtml(q[0])}<div class="opts">${q[1].map((o,oi)=>`(${letters[oi]}) ${escapeHtml(o)}`).join(" &nbsp; ")}</div></span>
          </label>`;
        }).join("");
      });
    }
    if (state.types.includes("short") && ch.short.length) {
      html += `<div class="sec-label">Short Questions</div>`;
      ch.short.forEach((group, exIdx) => {
        html += `<div class="exercise-label">${escapeHtml(group.exercise)}</div>`;
        html += group.questions.map((q, qIdx) => {
          const checked = picks.short.some(p => p.chId === ch.id && p.exIdx === exIdx && p.qIdx === qIdx) ? "checked" : "";
          return `<label class="q-row">
            <input type="checkbox" data-type="short" data-exidx="${exIdx}" data-qidx="${qIdx}" ${checked}>
            <span>${escapeHtml(q.text)}${q.diagram ? `<div class="q-diagram">${q.diagram}</div>` : ""}</span>
          </label>`;
        }).join("");
      });
    }
    if (state.types.includes("long") && ch.long.length) {
      html += `<div class="sec-label">Long Questions</div>`;
      ch.long.forEach((group, exIdx) => {
        html += `<div class="exercise-label">${escapeHtml(group.exercise)}</div>`;
        html += group.questions.map((q, qIdx) => {
          const checked = picks.long.some(p => p.chId === ch.id && p.exIdx === exIdx && p.qIdx === qIdx) ? "checked" : "";
          return `<label class="q-row">
            <input type="checkbox" data-type="long" data-exidx="${exIdx}" data-qidx="${qIdx}" ${checked}>
            <span>${escapeHtml(q.text)}${q.diagram ? `<div class="q-diagram">${q.diagram}</div>` : ""}</span>
          </label>`;
        }).join("");
      });
    }
    document.getElementById("pickerSections").innerHTML = html;
    document.getElementById("pickerSections").dataset.chId = chId;
    renderMathIn(document.getElementById("pickerSections"));
    setView("pickerView");
  }

  // Save picks whenever leaving the picker view
  function collectPickerSelections() {
    const chId = Number(document.getElementById("pickerSections").dataset.chId);
    const ch = chapterData.chapters.find(c => c.id === chId);
    const picks = getPicks();

    // MCQ: flat array, unchanged shape (regular + stimulus-based merged together)
    picks.mcq = picks.mcq.filter(p => p.chId !== chId);
    document.querySelectorAll(`input[data-type="mcq"]`).forEach(box => {
      if (box.checked) {
        const idx = Number(box.dataset.idx);
        const q = ch.mcq[idx];
        picks.mcq.push({ chId: chId, chName: ch.name, idx: idx, text: q[0], options: q[1], correct: q[2] });
      }
    });
    document.querySelectorAll(`input[data-type="mcqstim"]`).forEach(box => {
      if (box.checked) {
        const gIdx = Number(box.dataset.gidx);
        const idx = Number(box.dataset.idx);
        const group = ch.mcqStimulus[gIdx];
        const q = group.questions[idx];
        picks.mcq.push({
          chId: chId, chName: ch.name, idx: idx, stimGroup: gIdx,
          text: q[0], options: q[1], correct: q[2], stimulus: group.stimulus
        });
      }
    });

    // Short/Long: grouped by exercise
    ["short", "long"].forEach(type => {
      picks[type] = picks[type].filter(p => p.chId !== chId);
      document.querySelectorAll(`input[data-type="${type}"]`).forEach(box => {
        if (box.checked) {
          const exIdx = Number(box.dataset.exidx);
          const qIdx = Number(box.dataset.qidx);
          const group = ch[type][exIdx];
          const q = group.questions[qIdx];
          picks[type].push({
            chId: chId,
            chName: ch.name,
            exercise: group.exercise,
            exIdx: exIdx,
            qIdx: qIdx,
            text: q.text,
            answer: q.answer,
            diagram: q.diagram || null
          });
        }
      });
    });

    savePicks(picks);
  }

  const origShowChapterList = showChapterList;
  showChapterList = function() {
    if (document.getElementById("pickerView").classList.contains("active")) {
      collectPickerSelections();
    }
    origShowChapterList();
  };

  function goToPreview() {
    window.location.href = "details.html";
  }
</script>
</body>
</html>
