<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Paper Generator — Chapters</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Paper Generator</h1>
      <p>Chapter selection</p>
    </div>
    <button class="btn btn-ghost" style="width:auto; padding:8px 14px; font-size:13px;" onclick="logout()">Log Out</button>
  </header>

  <main>
    <div class="card" id="recap"></div>
    <p style="font-size:13px; color:var(--gray);">
      Chapter list and question picker will be built here next, using the per-subject data files.
    </p>
    <button class="btn btn-ghost" onclick="window.location.href='categories.html'">Back</button>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin();
  const state = getSelectionState();
  if (!state.class || !state.subject || !state.types) {
    window.location.href = "home.html";
  }
  document.getElementById("recap").innerHTML =
    "<strong>Class " + state.class + " · " + state.subject + "</strong><br>" +
    "<span style='font-size:13px; color:var(--gray);'>Sections: " + state.types.join(", ") + "</span>";
</script>
</body>
</html>
