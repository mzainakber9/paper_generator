<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Paper Generator — Categories</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Paper Generator</h1>
      <p id="selMsg">Class · Subject</p>
    </div>
    <button class="btn btn-ghost" style="width:auto; padding:8px 14px; font-size:13px;" onclick="logout()">Log Out</button>
  </header>

  <main>
    <h2 style="font-size:19px; margin:0 0 4px;">What do you want to include?</h2>
    <p style="font-size:13px; color:var(--gray); margin:0 0 18px;">Only the selected sections will appear later.</p>

    <div class="card" style="display:flex; align-items:center; gap:12px;">
      <input type="checkbox" id="chkMcq" style="width:18px;height:18px;accent-color:var(--maroon);" checked>
      <div>
        <label for="chkMcq" style="font-weight:600; font-size:14px;">Multiple Choice Questions</label>
      </div>
    </div>
    <div class="card" style="display:flex; align-items:center; gap:12px;">
      <input type="checkbox" id="chkShort" style="width:18px;height:18px;accent-color:var(--maroon);" checked>
      <div>
        <label for="chkShort" style="font-weight:600; font-size:14px;">Short Questions</label>
      </div>
    </div>
    <div class="card" style="display:flex; align-items:center; gap:12px;">
      <input type="checkbox" id="chkLong" style="width:18px;height:18px;accent-color:var(--maroon);">
      <div>
        <label for="chkLong" style="font-weight:600; font-size:14px;">Long Questions</label>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn btn-ghost" onclick="window.location.href='home.html'">Back</button>
      <button class="btn btn-primary" id="continueBtn" onclick="goToChapters()">Continue</button>
    </div>
  </main>
</div>

<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  requireLogin();
  const state = getSelectionState();
  if (!state.class || !state.subject) {
    window.location.href = "home.html";
  }
  document.getElementById("selMsg").textContent = "Class " + state.class + " · " + state.subject;

  const chkMcq = document.getElementById("chkMcq");
  const chkShort = document.getElementById("chkShort");
  const chkLong = document.getElementById("chkLong");
  const continueBtn = document.getElementById("continueBtn");

  function updateContinue() {
    continueBtn.disabled = !(chkMcq.checked || chkShort.checked || chkLong.checked);
  }
  [chkMcq, chkShort, chkLong].forEach(c => c.addEventListener("change", updateContinue));
  updateContinue();

  function goToChapters() {
    const types = [];
    if (chkMcq.checked) types.push("mcq");
    if (chkShort.checked) types.push("short");
    if (chkLong.checked) types.push("long");
    saveSelection("types", types);
    window.location.href = "chapters.html";
  }
</script>
</body>
</html>
